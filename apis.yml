aid: webpt
name: WebPT
description: >-
  WebPT is a rehabilitation-therapy software company providing a cloud practice-management
  platform for physical, occupational, and speech therapy and behavioral-health clinics. Its
  integrated suite spans clinical documentation and EMR, billing and revenue-cycle management,
  front-office scheduling and digital patient intake, benefits verification, home exercise
  programs, patient engagement and outcomes tracking, marketing, and practice analytics. WebPT
  connects to 60+ EHR and healthcare systems (Epic, athenahealth, Veradigm, McKesson, Meditech,
  Oracle Cloud, ModMed and others) through an integrations program built on HL7 interfaces
  (ADT, BAR, DFT, MDM/ORU). WebPT does not publish a public REST API, developer portal, or
  OpenAPI definition; integration is arranged through its partner and integrations program.
  WebPT is a Battery Ventures portfolio company.
